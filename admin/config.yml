# Editor settings for /admin. Every "Publish" in the editor becomes a commit
# on the branch below, and Netlify redeploys the site automatically.
backend:
  name: github
  repo: MathewVadasseril/msv-blogs
  branch: main
  commit_messages:
    create: "Add {{collection}} “{{slug}}”"
    update: "Update {{collection}} “{{slug}}”"
    delete: "Delete {{collection}} “{{slug}}”"

# Drafts: every post and booklet has a "Draft" switch, on by default. Entries with it on
# are hidden from the site and listed under "Drafts" in the editor's sidebar; switching
# it off and saving publishes the entry. Drafts stay until they're deleted.

media_folder: images/uploads
public_folder: images/uploads

collections:
  # ---------------------------------------------------------------- Posts
  - name: posts
    label: Blog Posts
    label_singular: Blog Post
    description: Published articles. Drafts are listed under Drafts below.
    folder: content/posts
    format: json
    extension: json
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} · {{date}}"
    sortable_fields: [date, title]
    filter: { field: draft, value: [false, null] }   # published only
    fields: &post_fields
      - { name: title, label: Title, widget: string }
      - { name: date, label: Publish date, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }
      - { name: summary, label: Summary, widget: markdown, minimal: true, buttons: [bold, italic, strikethrough, link, code], editor_components: [], hint: "One or two sentences shown on the home page." }
      - { name: topics, label: Topics, widget: list, hint: "Comma-separated, e.g. Growth Strategy, Pricing. These power the topic filters." }
      - { name: draft, label: "Draft (hide from site)", widget: boolean, default: true, required: false, hint: "Switch off, then click Publish to put it on the site." }
      - { name: body, label: Article, widget: markdown }

  # ---------------------------------------------------------------- Booklets
  - name: booklets
    label: Strategy Booklets
    label_singular: Booklet
    description: Published booklets, made of chapters you can add, rename, reorder and build from blocks. Drafts are listed under Drafts below.
    folder: content/booklets
    format: json
    extension: json
    create: true
    slug: "{{slug}}"
    identifier_field: title
    sortable_fields: [order, title]
    filter: { field: draft, value: [false, null] }   # published only
    fields: &booklet_fields
      - { name: title, label: Title, widget: string }
      - { name: subtitle, label: Subtitle, widget: markdown, minimal: true, buttons: [bold, italic, strikethrough, link, code], editor_components: [] }
      - { name: volume, label: Volume label, widget: string, hint: "e.g. Vol. 03" }
      - { name: order, label: Order in library, widget: number, value_type: int, default: 99 }
      - { name: industry, label: Industry badge, widget: string }
      - { name: audience, label: Audience badge, widget: string }
      - { name: readTime, label: Reading time (minutes), widget: number, value_type: int, default: 15 }
      - { name: topics, label: Topics, widget: list, hint: "Comma-separated. These power the topic filters." }
      - name: icon
        label: Cover icon
        widget: select
        default: fa-chess-knight
        options:
          - { label: Network diagram, value: fa-diagram-project }
          - { label: Boxes, value: fa-boxes-stacked }
          - { label: Chess knight, value: fa-chess-knight }
          - { label: Chart, value: fa-chart-line }
          - { label: Lightbulb, value: fa-lightbulb }
          - { label: Globe, value: fa-earth-americas }
          - { label: Coins, value: fa-coins }
          - { label: Rocket, value: fa-rocket }
          - { label: Scale, value: fa-scale-balanced }
          - { label: Industry, value: fa-industry }
      - name: color
        label: Cover colour
        widget: select
        default: from-sky-500 to-blue-600
        options:
          - { label: Indigo → Violet, value: from-indigo-500 to-violet-500 }
          - { label: Amber → Orange, value: from-amber-500 to-orange-600 }
          - { label: Sky → Blue, value: from-sky-500 to-blue-600 }
          - { label: Emerald → Teal, value: from-emerald-500 to-teal-600 }
          - { label: Rose → Pink, value: from-rose-500 to-pink-600 }
          - { label: Slate → Zinc, value: from-slate-500 to-zinc-700 }
      - { name: draft, label: "Draft (hide from site)", widget: boolean, default: true, required: false, hint: "Switch off, then click Publish to put it on the site." }

      - label: Chapters
        label_singular: Chapter
        name: chapters
        widget: list
        hint: "Add chapters with the + button, rename them, drag to reorder, or delete. A chapter's type sets its layout."
        types:
          - name: blocks
            label: "Build your own (stack blocks in any order)"
            widget: object
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Chapter title, widget: string }
              - { name: kicker, label: "Small label above the title (optional)", widget: string, required: false }
              - name: blocks
                label: Blocks
                label_singular: Block
                widget: list
                hint: "Add blocks with the + button and drag them into any order."
                types:
                  - name: text
                    label: Text
                    widget: object
                    fields:
                      - { name: markdown, label: Text, widget: markdown, hint: "Paragraphs, headings, lists, links and images." }
                  - name: image
                    label: Image
                    widget: object
                    fields:
                      - { name: image, label: Image, widget: image, hint: "Upload a picture (ideally under 1 MB) or paste an image link." }
                      - { name: alt, label: Image description, widget: string, required: false, hint: "Describes the picture for screen readers and if it fails to load." }
                      - { name: caption, label: Caption, widget: string, required: false }
                      - name: size
                        label: Size
                        widget: select
                        default: medium
                        options:
                          - { label: Small, value: small }
                          - { label: Medium, value: medium }
                          - { label: Full width, value: wide }
                  - name: callout
                    label: Callout box
                    widget: object
                    summary: "{{fields.heading}}"
                    fields:
                      - { name: heading, label: Label, widget: string, required: false, default: The Analogy }
                      - { name: icon, label: "Icon (Font Awesome name, e.g. fa-comment-dots)", widget: string, required: false, default: fa-comment-dots }
                      - { name: text, label: Text, widget: markdown, minimal: true, buttons: [bold, italic, strikethrough, link, code], editor_components: [] }
                  - name: cards
                    label: Cards
                    widget: object
                    fields:
                      - name: items
                        label: Cards
                        label_singular: Card
                        widget: list
                        summary: "{{fields.title}}"
                        fields:
                          - { name: icon, label: "Icon (Font Awesome name, e.g. fa-bolt)", widget: string, required: false, default: fa-bolt }
                          - { name: title, label: Title, widget: string }
                          - { name: text, label: Text, widget: markdown, minimal: true, buttons: [bold, italic, strikethrough, link, code], editor_components: [] }
                  - name: quote
                    label: Quote
                    widget: object
                    fields:
                      - { name: text, label: Quote, widget: markdown, minimal: true, buttons: [bold, italic, strikethrough, link, code], editor_components: [] }
                      - { name: author, label: Author, widget: string, required: false }
                  - name: table
                    label: Table
                    widget: object
                    summary: "{{fields.title}}"
                    fields:
                      - { name: title, label: Table title, widget: string, required: false }
                      - { name: headers, label: Column headers, widget: list, field: { name: header, label: Header, widget: string } }
                      - { name: rows, label: "Rows (separate cells with |)", widget: list, field: { name: row, label: Row, widget: string } }
                  - name: metrics
                    label: Number tiles
                    widget: object
                    fields:
                      - name: items
                        label: Tiles
                        label_singular: Tile
                        widget: list
                        summary: "{{fields.value}} {{fields.label}}"
                        fields:
                          - { name: value, label: "Number (e.g. $95, 250+)", widget: string }
                          - { name: label, label: Label, widget: string }
                  - name: timeline
                    label: Timeline
                    widget: object
                    summary: "{{fields.title}}"
                    fields:
                      - { name: title, label: Heading, widget: string, required: false }
                      - name: steps
                        label: Steps
                        label_singular: Step
                        widget: list
                        summary: "{{fields.phase}}"
                        fields:
                          - { name: phase, label: Step title, widget: string }
                          - { name: text, label: Description, widget: markdown, minimal: true, buttons: [bold, italic, strikethrough, link, code], editor_components: [] }
                  - name: listbox
                    label: List box
                    widget: object
                    summary: "{{fields.title}}"
                    fields:
                      - { name: title, label: Heading, widget: string, required: false }
                      - { name: icon, label: "Bullet icon (Font Awesome name)", widget: string, required: false, default: fa-check }
                      - { name: items, label: Items, widget: list, field: { name: item, label: Item, widget: markdown, minimal: true, buttons: [bold, italic, strikethrough, link, code], editor_components: [] } }
          - name: text
            label: "Free-form chapter (write anything)"
            widget: object
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Chapter title, widget: string }
              - { name: kicker, label: "Small label above the title (optional)", widget: string, required: false }
              - { name: markdown, label: Chapter content, widget: markdown }
          - name: intuition
            label: "Simple business case (analogy, summary, takeaways)"
            widget: object
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Chapter title, widget: string }
              - { name: kicker, label: "Small label above the title (optional)", widget: string, required: false }
              - { name: analogy, label: Analogy (callout card), widget: markdown, minimal: true, buttons: [bold, italic, strikethrough, link, code], editor_components: [] }
              - { name: summary, label: Plain-English summary, widget: markdown, minimal: true, buttons: [bold, italic, strikethrough, link, code], editor_components: [] }
              - label: Takeaway cards
                name: takeaways
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: icon, label: "Icon (Font Awesome name, e.g. fa-bolt)", widget: string, default: fa-bolt }
                  - { name: title, label: Title, widget: string }
                  - { name: text, label: Text, widget: markdown, minimal: true, buttons: [bold, italic, strikethrough, link, code], editor_components: [] }
              - { name: oneLiner, label: One-line summary quote, widget: string }
          - name: framework
            label: "Framework breakdown (sections, bullets, tables)"
            widget: object
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Chapter title, widget: string }
              - { name: kicker, label: "Small label above the title (optional)", widget: string, required: false }
              - { name: intro, label: Introduction, widget: markdown, minimal: true, buttons: [bold, italic, strikethrough, link, code], editor_components: [] }
              - label: Sections
                name: sections
                widget: list
                summary: "{{fields.heading}}"
                fields:
                  - { name: heading, label: Heading, widget: string }
                  - { name: body, label: Paragraph, widget: markdown, minimal: true, buttons: [bold, italic, strikethrough, link, code], editor_components: [] }
                  - { name: bullets, label: Bullet points, widget: list, field: { name: bullet, label: Bullet, widget: markdown, minimal: true, buttons: [bold, italic, strikethrough, link, code], editor_components: [] } }
              - { name: tableTitle, label: Table 1 title, widget: string }
              - label: Table 1
                name: table
                widget: object
                fields:
                  - { name: headers, label: Column headers, widget: list, field: { name: header, label: Header, widget: string } }
                  - { name: rows, label: "Rows (separate cells with |)", widget: list, field: { name: row, label: Row, widget: string } }
              - { name: table2Title, label: Table 2 title, widget: string, required: false }
              - label: Table 2
                name: table2
                widget: object
                required: false
                fields:
                  - { name: headers, label: Column headers, widget: list, required: false, field: { name: header, label: Header, widget: string } }
                  - { name: rows, label: "Rows (separate cells with |)", widget: list, required: false, field: { name: row, label: Row, widget: string } }
          - name: casestudy
            label: "Case study (metrics, timeline, drivers, lessons)"
            widget: object
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Chapter title, widget: string }
              - { name: kicker, label: "Small label above the title (optional)", widget: string, required: false }
              - { name: company, label: Company, widget: string }
              - { name: tagline, label: Tagline, widget: string }
              - { name: context, label: Context, widget: markdown, minimal: true, buttons: [bold, italic, strikethrough, link, code], editor_components: [] }
              - label: Key metrics
                name: metrics
                widget: list
                summary: "{{fields.value}} {{fields.label}}"
                fields:
                  - { name: value, label: Value, widget: string }
                  - { name: label, label: Label, widget: string }
              - label: Execution timeline
                name: execution
                widget: list
                summary: "{{fields.phase}}"
                fields:
                  - { name: phase, label: Phase, widget: string }
                  - { name: text, label: Description, widget: markdown, minimal: true, buttons: [bold, italic, strikethrough, link, code], editor_components: [] }
              - { name: drivers, label: Success drivers, widget: list, field: { name: driver, label: Driver, widget: markdown, minimal: true, buttons: [bold, italic, strikethrough, link, code], editor_components: [] } }
              - label: Lessons learned
                name: lessons
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: text, label: Text, widget: markdown, minimal: true, buttons: [bold, italic, strikethrough, link, code], editor_components: [] }
          - name: slides
            label: "Slide strategy (slide cards, tips)"
            widget: object
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Chapter title, widget: string }
              - { name: kicker, label: "Small label above the title (optional)", widget: string, required: false }
              - { name: intro, label: Introduction, widget: markdown, minimal: true, buttons: [bold, italic, strikethrough, link, code], editor_components: [] }
              - label: Slides
                name: slides
                widget: list
                summary: "Slide {{fields.n}}: {{fields.title}}"
                fields:
                  - { name: n, label: Slide number, widget: number, value_type: int }
                  - { name: title, label: Title, widget: string }
                  - { name: icon, label: Icon (Font Awesome name), widget: string, default: fa-bolt }
                  - { name: headline, label: Action headline, widget: string }
                  - { name: content, label: Content points, widget: list, field: { name: point, label: Point, widget: string } }
                  - { name: visual, label: Suggested visual, widget: string }
              - { name: tips, label: Judge-winning tips, widget: list, field: { name: tip, label: Tip, widget: markdown, minimal: true, buttons: [bold, italic, strikethrough, link, code], editor_components: [] } }
          - name: venture
            label: "Startup idea & financials (market, unit economics, funding)"
            widget: object
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Chapter title, widget: string }
              - { name: kicker, label: "Small label above the title (optional)", widget: string, required: false }
              - { name: name, label: Startup name, widget: string }
              - { name: tagline, label: Tagline, widget: string }
              - { name: problem, label: Problem, widget: markdown, minimal: true, buttons: [bold, italic, strikethrough, link, code], editor_components: [] }
              - { name: solution, label: Solution, widget: markdown, minimal: true, buttons: [bold, italic, strikethrough, link, code], editor_components: [] }
              - label: Market sizing
                name: market
                widget: list
                summary: "{{fields.tier}} {{fields.value}}"
                fields:
                  - { name: tier, label: Tier (TAM / SAM / SOM), widget: string }
                  - { name: value, label: Value, widget: string }
                  - { name: desc, label: Description, widget: string }
              - label: Unit economics
                name: unitEconomics
                widget: list
                summary: "{{fields.label}}: {{fields.value}}"
                fields:
                  - { name: label, label: Metric, widget: string }
                  - { name: value, label: Value, widget: string }
              - label: Funding
                name: funding
                widget: object
                fields:
                  - { name: ask, label: Round & amount, widget: string }
                  - { name: runway, label: Runway, widget: string }
                  - label: Use of funds
                    name: uses
                    widget: list
                    summary: "{{fields.label}} ({{fields.pct}}%)"
                    fields:
                      - { name: label, label: Use, widget: string }
                      - { name: pct, label: Percent, widget: number, value_type: int }
                  - { name: milestones, label: Milestones, widget: list, field: { name: milestone, label: Milestone, widget: string } }

  # ---------------------------------------------------------------- Drafts
  # The same posts and booklets, showing only those with Draft switched on.
  - divider: true
  - name: post_drafts
    label: Draft Posts
    label_singular: Draft Post
    description: Posts with Draft switched on, hidden from the site. Switch Draft off and save to publish.
    folder: content/posts
    format: json
    extension: json
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} · {{date}}"
    sortable_fields: [date, title]
    filter: { field: draft, value: true }
    fields: *post_fields

  - name: booklet_drafts
    label: Draft Booklets
    label_singular: Draft Booklet
    description: Booklets with Draft switched on, hidden from the site. Switch Draft off and save to publish.
    folder: content/booklets
    format: json
    extension: json
    create: true
    slug: "{{slug}}"
    identifier_field: title
    sortable_fields: [order, title]
    filter: { field: draft, value: true }
    fields: *booklet_fields

  - divider: true

  # ---------------------------------------------------------------- Site text
  - name: settings
    label: Site Settings
    description: Text on the home page, header and footer.
    format: json
    files:
      - name: site
        label: Home page, header & footer text
        file: content/site.json
        fields:
          - { name: siteName, label: Site name, widget: string, hint: "Shown in the header, as the big home page title, and in browser tabs." }
          - { name: headerTagline, label: Header tagline, widget: string, required: false, hint: "Small text next to the site name in the header. Leave empty to hide." }
          - { name: homeEyebrow, label: Home page label, widget: string, required: false, hint: "Small coloured text above the home page title. Leave empty to hide." }
          - { name: homeIntro, label: Home page introduction, widget: markdown, minimal: true, buttons: [bold, italic, strikethrough, link, code], editor_components: [], required: false, hint: "Paragraph under the title. Supports **bold**, *italic* and [links](https://example.com)." }
          - { name: bookletsHeading, label: Booklets section heading, widget: string, default: Strategy Booklets }
          - { name: postsHeading, label: Blog posts section heading, widget: string, default: Blog Posts }
          - { name: footerText, label: Footer text, widget: string, required: false, hint: "Shown after © year and the site name." }
          - { name: footerNote, label: Footer note (right side), widget: string, required: false }
