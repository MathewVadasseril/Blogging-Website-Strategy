<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mathew - Blogs</title>
  <meta name="description" content="An interactive digital library of business strategy booklets: frameworks, case studies, case-competition slide strategy and startup ideas." />


  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Markdown renderer for posts written in the editor -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script>
    if (window.tailwind) tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            serif: ['"Source Serif 4"', 'Georgia', 'serif'],
          },
          colors: {
            ink: { 50: '#f7f7f5', 100: '#efeeea', 200: '#e2e0d9', 700: '#2b2a27', 800: '#1c1b19', 900: '#121211' },
            accent: { DEFAULT: '#c2410c', soft: '#fff1e8', dark: '#fb923c' },
          },
        },
      },
    };
  </script>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <style>
    html { scroll-padding-top: 8.5rem; }
    body { -webkit-font-smoothing: antialiased; }
    .chapter { scroll-margin-top: 8.5rem; }
    .bar-link.active { background: #121211; color: #fff; border-color: #121211; }
    .dark .bar-link.active { background: #fff; color: #121211; border-color: #fff; }
    .topic-chip.active { background: #121211; color: #fff; border-color: #121211; }
    .dark .topic-chip.active { background: #fff; color: #121211; border-color: #fff; }
    .no-scrollbar { scrollbar-width: none; } .no-scrollbar::-webkit-scrollbar { display: none; }
    .prose-body p { line-height: 1.8; }
    .post-body { font-size: 1.0625rem; line-height: 1.8; }
    .post-body > * + * { margin-top: 1.1em; }
    .post-body h2:not(.msv-widget *) { font-family: "Source Serif 4", Georgia, serif; font-size: 1.6rem; font-weight: 600; line-height: 1.25; margin-top: 2em; }
    .post-body h3:not(.msv-widget *) { font-weight: 600; font-size: 1.2rem; margin-top: 1.6em; }
    .post-body a:not(.msv-widget *) { color: #c2410c; text-decoration: underline; text-underline-offset: 3px; }
    .dark .post-body a:not(.msv-widget *) { color: #fb923c; }
    .post-body ul:not(.msv-widget *) { list-style: disc; padding-left: 1.4em; } .post-body ol:not(.msv-widget *) { list-style: decimal; padding-left: 1.4em; }
    .post-body li:not(.msv-widget *) + li { margin-top: .35em; }
    .post-body blockquote:not(.msv-widget *) { border-left: 4px solid currentColor; padding-left: 1.1em; font-family: "Source Serif 4", Georgia, serif; font-style: italic; font-size: 1.2rem; }
    .post-body code:not(.msv-widget *) { font-size: .9em; padding: .1em .35em; border-radius: .35em; background: rgba(120,120,120,.15); }
    .post-body pre:not(.msv-widget *) { overflow-x: auto; padding: 1em; border-radius: .75em; background: #121211; color: #efeeea; }
    .post-body pre code:not(.msv-widget *) { background: none; padding: 0; }
    .post-body img:not(.msv-widget *) { border-radius: .9em; margin-inline: auto; max-height: 80vh; width: auto; }
    .post-body hr:not(.msv-widget *) { border-color: rgba(120,120,120,.25); margin-block: 2em; }
    .post-body table:not(.msv-widget *) { width: 100%; font-size: .95em; display: block; overflow-x: auto; }
    .post-body th:not(.msv-widget *), .post-body td:not(.msv-widget *) { border-bottom: 1px solid rgba(120,120,120,.25); padding: .5em .75em; text-align: left; }
    #booklet { transition: opacity .25s ease, transform .25s ease; }
    #booklet.is-switching { opacity: 0; transform: translateY(8px); }
    .nav-link.active { color: #c2410c; background: rgba(194, 65, 12, .08); }
    .dark .nav-link.active { color: #fb923c; background: rgba(251, 146, 60, .12); }
    .nav-link.active .nav-dot { background: currentColor; transform: scale(1.3); }
    .sidebar-scroll::-webkit-scrollbar { width: 6px; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: rgba(120,120,120,.25); border-radius: 9999px; }
    table { border-collapse: separate; border-spacing: 0; }
    @media print { aside, header, #progress { display: none !important; } main { margin: 0 !important; } }
  </style>
</head>

<body class="bg-ink-50 text-ink-800 dark:bg-ink-900 dark:text-ink-100 font-sans transition-colors duration-300">

  <!-- Reading progress -->
  <div id="progress" class="fixed top-0 left-0 h-0.5 bg-accent dark:bg-accent-dark z-[60] w-0 transition-[width] duration-100"></div>

  <!-- Top bar -->
  <header class="fixed top-0 inset-x-0 h-16 z-50 bg-ink-50/85 dark:bg-ink-900/85 backdrop-blur border-b border-ink-200 dark:border-white/10">
    <div class="h-full flex items-center justify-between px-4 lg:px-6">
      <div class="flex items-center gap-3">
        <button id="menuBtn" class="lg:hidden w-10 h-10 grid place-items-center rounded-lg hover:bg-ink-100 dark:hover:bg-white/5" aria-label="Open navigation">
          <i class="fa-solid fa-bars"></i>
        </button>
        <a href="#" class="flex items-center gap-2.5" id="brand">
          <span class="w-8 h-8 rounded-lg bg-ink-900 dark:bg-white text-white dark:text-ink-900 grid place-items-center text-sm"><i class="fa-solid fa-book-open"></i></span>
          <span id="siteName" class="font-serif text-lg font-semibold tracking-tight">Mathew - Blogs</span>
          <span id="siteTagline" class="hidden sm:inline text-xs text-ink-700/60 dark:text-white/40 border-l border-ink-200 dark:border-white/10 pl-2.5 ml-0.5">Strategy Booklets</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Mobile overlay -->
  <div id="overlay" class="fixed inset-0 bg-black/40 z-40 hidden lg:hidden"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed top-16 bottom-0 left-0 w-72 z-40 bg-ink-50 dark:bg-ink-900 border-r border-ink-200 dark:border-white/10 -translate-x-full lg:translate-x-0 transition-transform duration-300">
    <div class="sidebar-scroll h-full overflow-y-auto px-4 py-6 space-y-8">
      <button data-home class="home-link w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium border border-ink-200 dark:border-white/10 hover:bg-white dark:hover:bg-white/5 transition">
        <i class="fa-solid fa-house text-accent dark:text-accent-dark"></i><span>Library Home</span>
        <span id="homeCount" class="ml-auto text-[11px] font-mono text-ink-700/50 dark:text-white/40"></span>
      </button>
      <section>
        <h2 class="px-2 mb-3 text-[11px] font-semibold uppercase tracking-[.14em] text-ink-700/50 dark:text-white/40">Select Booklet</h2>
        <ul id="bookletList" class="space-y-1.5"></ul>
      </section>
      <section id="postSection">
        <h2 class="px-2 mb-3 text-[11px] font-semibold uppercase tracking-[.14em] text-ink-700/50 dark:text-white/40">Latest Posts</h2>
        <ul id="postList" class="space-y-0.5"></ul>
      </section>
      <section id="chapterSection">
        <h2 class="px-2 mb-3 text-[11px] font-semibold uppercase tracking-[.14em] text-ink-700/50 dark:text-white/40">Chapter Navigation</h2>
        <nav id="chapterNav" class="space-y-0.5"></nav>
      </section>
      <section id="tipSection" class="mx-2 p-4 rounded-xl border border-dashed border-ink-200 dark:border-white/10 text-xs leading-relaxed text-ink-700/70 dark:text-white/50">
        <i class="fa-solid fa-lightbulb text-accent dark:text-accent-dark mr-1"></i>
        Tip: press <kbd class="px-1.5 py-0.5 rounded bg-ink-100 dark:bg-white/10 font-mono">1</kbd>–<kbd id="tipMax" class="px-1.5 py-0.5 rounded bg-ink-100 dark:bg-white/10 font-mono">5</kbd> to jump between chapters.
      </section>
    </div>
  </aside>

  <!-- Main canvas -->
  <main class="pt-16 lg:ml-72">
    <!-- Home / library view -->
    <section id="home" class="max-w-5xl mx-auto px-4 sm:px-8 py-10 sm:py-14 hidden"></section>

    <!-- Blog post view -->
    <article id="postView" class="max-w-3xl mx-auto px-4 sm:px-8 py-10 sm:py-14 hidden"></article>

    <!-- Booklet view -->
    <div id="bookletView" class="hidden">
      <div id="contentBar" class="sticky top-16 z-30 bg-ink-50/90 dark:bg-ink-900/90 backdrop-blur border-b border-ink-200 dark:border-white/10">
        <div class="max-w-4xl mx-auto px-4 sm:px-8 h-14 flex items-center gap-3">
          <button data-home class="shrink-0 inline-flex items-center gap-1.5 h-8 px-3 rounded-full text-xs font-medium border border-ink-200 dark:border-white/15 hover:bg-white dark:hover:bg-white/5" title="Back to library">
            <i class="fa-solid fa-arrow-left text-[10px]"></i><span class="hidden sm:inline">Library</span>
          </button>
          <span class="shrink-0 w-px h-5 bg-ink-200 dark:bg-white/10"></span>
          <nav id="barLinks" class="flex-1 min-w-0 flex items-center gap-1.5 overflow-x-auto no-scrollbar" aria-label="Chapters in this booklet"></nav>
          <label for="bookletJump" class="sr-only">Jump to booklet</label>
          <select id="bookletJump" class="hidden md:block shrink-0 max-w-[11rem] h-8 rounded-full text-xs pl-3 pr-7 border border-ink-200 dark:border-white/15 bg-white dark:bg-ink-800 text-ink-800 dark:text-white/80"></select>
        </div>
      </div>
      <article id="booklet" class="max-w-4xl mx-auto px-4 sm:px-8 py-10 sm:py-14"></article>
    </div>
    <footer class="max-w-4xl mx-auto px-4 sm:px-8 pb-12 text-xs text-ink-700/50 dark:text-white/30 flex flex-wrap justify-between gap-2 border-t border-ink-200 dark:border-white/10 pt-6">
      <span id="footerText">&copy; <span id="year"></span> Mathew - Blogs. Educational content for strategy students &amp; operators.</span>
      <span id="footerNote">Figures in startup models are illustrative.</span>
    </footer>
  </main>

  <script>
  /* =========================================================
     DATASET
     ========================================================= */
  // Each booklet has its own list of chapters. A chapter's type picks its layout.
  const CHAPTER_TYPES = {
    blocks: { icon: 'fa-cubes' },
    intuition: { icon: 'fa-seedling' },
    framework: { icon: 'fa-sitemap' },
    casestudy: { icon: 'fa-globe' },
    slides: { icon: 'fa-person-chalkboard' },
    venture: { icon: 'fa-rocket' },
    text: { icon: 'fa-align-left' },
  };

  // Booklet files from before editable chapters stored five fixed chapters as ch1–ch5.
  const LEGACY_CHAPTERS = [
    ['ch1', 'intuition', 'Simple Business Case', 'Quick Intuition'],
    ['ch2', 'framework', 'Detailed Framework Breakdown', 'Deep Dive'],
    ['ch3', 'casestudy', 'Real-World Application', 'Case Study'],
    ['ch4', 'slides', 'Case Competition Slide Strategy', 'The 3-Slide Deck'],
    ['ch5', 'venture', 'Inspired Startup Idea & Financials', 'Venture Lab'],
  ];

  // The chapter list used by the sidebar, content bar, home cards and keyboard shortcuts.
  const chaptersOf = b => (b ? b.chapters : []).map((c, i) => ({
    id: `ch${i + 1}`, num: i + 1, label: c.title, icon: (CHAPTER_TYPES[c.type] || CHAPTER_TYPES.text).icon,
  }));

  // Booklets and posts are written in the editor at /admin and saved as files in
  // content/. On every deploy, scripts/build-content.js bundles them into
  // content/library.json, which is loaded below.
  let BOOKLETS = [];
  let POSTS = [];

  // Home page, header and footer text, edited under "Site Settings" in the editor.
  const SITE_DEFAULTS = {
    siteName: 'Mathew - Blogs',
    headerTagline: 'Strategy Booklets',
    homeEyebrow: 'The Library',
    homeIntro: 'Business strategy booklets and blog posts for case competitors, students and operators. Each booklet moves from a plain-English intuition to a full framework, a real case, a 3-slide deck plan and a startup idea with numbers.',
    bookletsHeading: 'Strategy Booklets',
    postsHeading: 'Blog Posts',
    footerText: 'Educational content for strategy students & operators.',
    footerNote: 'Figures in startup models are illustrative.',
  };
  let SITE = { ...SITE_DEFAULTS };

  const inlineMd = str => (window.marked ? marked.parseInline(str) : str);
  // Widgets inserted from the editor toolbar are saved inside Markdown as ```msv-block fences
  // holding JSON. They're swapped for placeholders, Markdown is rendered, then each widget
  // is drawn with the same renderers as the "Build your own" chapter blocks.
  const WIDGET_FENCE = /^```msv-block[ \t]*\n([\s\S]*?)\n```[ \t]*$/gm;
  function blockMd(str) {
    if (!window.marked) return `<p>${str}</p>`;
    const widgets = [];
    const source = String(str).replace(WIDGET_FENCE, (_, json) => `\n<div data-msv-widget="${widgets.push(json) - 1}"></div>\n`);
    return marked.parse(source).replace(/<div data-msv-widget="(\d+)"><\/div>/g, (_, i) => renderWidget(widgets[+i]));
  }
  function renderWidget(json) {
    try {
      const block = renderInlineMarkdown(blockWithDefaults(JSON.parse(json)));
      return `<div class="msv-widget my-8">${(BLOCK_RENDERERS[block.type] || (() => ''))(block)}</div>`;
    } catch (_) { return ''; }
  }
  const esc = str => String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // Fields shown as plain text; every other text field may use Markdown (**bold**, *italic*, links).
  const PLAIN_FIELDS = new Set(['id', 'slug', 'type', 'title', 'kicker', 'icon', 'color', 'volume', 'industry', 'audience', 'topics', 'date', 'headers', 'image', 'alt', 'size']);
  function renderInlineMarkdown(value, key) {
    if (key === 'markdown') return blockMd(String(value ?? '')); // free-form chapter body
    if (PLAIN_FIELDS.has(key)) return Array.isArray(value) ? value.map(v => esc(v)) : esc(value);
    if (typeof value === 'string') return value.includes('\n') ? blockMd(value) : inlineMd(value);
    if (Array.isArray(value)) return value.map(v => renderInlineMarkdown(v, key));
    if (value && typeof value === 'object') {
      return Object.fromEntries(Object.entries(value).map(([k, v]) => [k, renderInlineMarkdown(v, k)]));
    }
    return value;
  }

  const list = v => (Array.isArray(v) ? v : []);

  function chapterWithDefaults(c) {
    const pick = keys => Object.fromEntries(keys.map(k => [k, c[k] ?? '']));
    const table = t => ({ headers: list(t?.headers), rows: list(t?.rows) });
    const type = CHAPTER_TYPES[c.type] ? c.type : 'text';
    const base = { ...c, type, title: c.title || 'Untitled chapter', kicker: c.kicker ?? '' };
    switch (type) {
      case 'intuition': return { ...base, ...pick(['analogy', 'summary', 'oneLiner']), takeaways: list(c.takeaways) };
      case 'framework': return { ...base, ...pick(['intro', 'tableTitle', 'table2Title']), sections: list(c.sections).map(x => ({ ...x, bullets: list(x.bullets) })), table: table(c.table), table2: table(c.table2) };
      case 'casestudy': return { ...base, ...pick(['company', 'tagline', 'context']), metrics: list(c.metrics), execution: list(c.execution), drivers: list(c.drivers), lessons: list(c.lessons) };
      case 'slides': return { ...base, ...pick(['intro']), slides: list(c.slides).map(x => ({ ...x, content: list(x.content) })), tips: list(c.tips) };
      case 'venture': return { ...base, ...pick(['name', 'tagline', 'problem', 'solution']), market: list(c.market), unitEconomics: list(c.unitEconomics),
        funding: { ask: '', runway: '', ...(c.funding || {}), uses: list(c.funding?.uses), milestones: list(c.funding?.milestones) } };
      case 'blocks': return { ...base, blocks: list(c.blocks).map(blockWithDefaults) };
      default: return { ...base, markdown: c.markdown ?? '' };
    }
  }

  // Blocks inside a "Build your own" chapter.
  function blockWithDefaults(k) {
    const pick = keys => Object.fromEntries(keys.map(key => [key, k[key] ?? '']));
    switch (k.type) {
      case 'text': return { type: 'text', ...pick(['markdown']) };
      case 'image': return { type: 'image', ...pick(['image', 'alt', 'caption', 'size']) };
      case 'callout': return { type: 'callout', ...pick(['heading', 'icon', 'text']) };
      case 'cards': return { type: 'cards', items: list(k.items) };
      case 'quote': return { type: 'quote', ...pick(['text', 'author']) };
      case 'table': return { type: 'table', ...pick(['title']), headers: list(k.headers), rows: list(k.rows) };
      case 'metrics': return { type: 'metrics', items: list(k.items) };
      case 'timeline': return { type: 'timeline', ...pick(['title']), steps: list(k.steps) };
      case 'listbox': return { type: 'listbox', ...pick(['title', 'icon']), items: list(k.items) };
      default: return { type: 'unknown' };
    }
  }

  // Fill in anything a half-finished booklet from the editor leaves out, so the page never breaks.
  function withDefaults(b) {
    const legacy = LEGACY_CHAPTERS.filter(([key]) => b[key]).map(([key, type, title, kicker]) => ({ type, title, kicker, ...b[key] }));
    return {
      volume: '', subtitle: '', industry: 'Strategy', audience: 'All readers', readTime: 10,
      icon: 'fa-chess-knight', color: 'from-sky-500 to-blue-600', ...b,
      topics: list(b.topics),
      chapters: (Array.isArray(b.chapters) ? b.chapters : legacy).map(chapterWithDefaults),
    };
  }

  function preparePost(p) {
    const words = String(p.body || '').trim().split(/\s+/).filter(Boolean).length;
    return {
      ...p,
      title: esc(p.title), topics: (p.topics || []).map(esc), summary: inlineMd(String(p.summary || '')),
      readTime: Math.max(1, Math.round(words / 220)),
      html: blockMd(String(p.body || '')),
    };
  }

  // Escapes every field for safe display; the introduction may use inline Markdown.
  function prepareSite(raw) {
    const merged = { ...SITE_DEFAULTS, ...(raw || {}) };
    const site = Object.fromEntries(Object.entries(merged).map(([k, v]) => [k, esc(v ?? '')]));
    site.homeIntro = inlineMd(String(merged.homeIntro ?? ''));
    site.plainName = String(merged.siteName || SITE_DEFAULTS.siteName); // for browser tab titles
    return site;
  }

  function applySiteText() {
    $('#siteName').innerHTML = SITE.siteName;
    $('#siteTagline').innerHTML = SITE.headerTagline;
    $('#siteTagline').classList.toggle('sm:inline', !!SITE.headerTagline);
    $('#footerText').innerHTML = `&copy; ${new Date().getFullYear()} ${SITE.siteName}.${SITE.footerText ? ' ' + SITE.footerText : ''}`;
    $('#footerNote').innerHTML = SITE.footerNote;
  }

  function formatDate(d) {
    const date = new Date(String(d).slice(0, 10) + 'T00:00:00');
    return isNaN(date) ? '' : date.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
  }

  /* =========================================================
     RENDERING
     ========================================================= */
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];

  let currentId = null;
  let observer = null;

  function chapterHeader(num, title, kicker) {
    return `
      <div class="flex items-start gap-4 mb-6">
        <div class="shrink-0 w-11 h-11 rounded-xl bg-ink-900 dark:bg-white text-white dark:text-ink-900 grid place-items-center font-serif font-bold text-lg">${num}</div>
        <div>
          <p class="text-[11px] font-semibold uppercase tracking-[.14em] text-accent dark:text-accent-dark">Chapter ${num}${kicker ? ` · ${kicker}` : ''}</p>
          <h2 class="font-serif text-2xl sm:text-3xl font-semibold tracking-tight mt-1">${title}</h2>
        </div>
      </div>`;
  }

  const card = 'rounded-2xl border border-ink-200 dark:border-white/10 bg-white dark:bg-white/[.03]';
  const muted = 'text-ink-700/75 dark:text-white/60';

  function renderTable(title, t) {
    if (!t || !t.headers.length || !t.rows.length) return '';
    t = { headers: t.headers, rows: t.rows.map(r => (Array.isArray(r) ? r : String(r).split('|').map(c => c.trim()))) };
    return `
      <h3 class="font-semibold text-lg mt-10 mb-3 flex items-center gap-2"><i class="fa-solid fa-table-columns text-accent dark:text-accent-dark text-sm"></i>${title}</h3>
      <div class="${card} overflow-x-auto">
        <table class="w-full text-sm min-w-[560px]">
          <thead>
            <tr class="bg-ink-100/70 dark:bg-white/5">
              ${t.headers.map((h, i) => `<th class="text-left font-semibold px-4 py-3 ${i === 0 ? 'rounded-tl-2xl' : ''} ${i === t.headers.length - 1 ? 'rounded-tr-2xl' : ''}">${h}</th>`).join('')}
            </tr>
          </thead>
          <tbody>
            ${t.rows.map(r => `
              <tr class="border-t border-ink-200 dark:border-white/10 hover:bg-ink-50 dark:hover:bg-white/[.02]">
                ${r.map((c, i) => `<td class="px-4 py-3 border-t border-ink-200/70 dark:border-white/5 ${i === 0 ? 'font-medium' : muted}">${c}</td>`).join('')}
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  }

  // One renderer per chapter layout. "text" is the free-form chapter.
  const CHAPTER_RENDERERS = {
    intuition: c => `
      ${c.analogy ? `<div class="relative rounded-2xl border border-orange-200 dark:border-orange-400/20 bg-accent-soft dark:bg-orange-400/[.06] p-6 sm:p-8">
        <div class="flex items-center gap-2 text-accent dark:text-accent-dark font-semibold text-sm mb-3"><i class="fa-solid fa-comment-dots"></i> The Analogy</div>
        <p class="font-serif text-lg sm:text-xl leading-relaxed">${c.analogy}</p>
      </div>` : ''}
      ${c.summary ? `<div class="prose-body mt-6 text-[17px] ${muted}"><p>${c.summary}</p></div>` : ''}
      <div class="grid sm:grid-cols-3 gap-4 mt-8">
        ${c.takeaways.map(t => `
          <div class="${card} p-5">
            <div class="w-9 h-9 rounded-lg bg-ink-100 dark:bg-white/10 grid place-items-center mb-3"><i class="fa-solid ${t.icon} text-accent dark:text-accent-dark"></i></div>
            <h4 class="font-semibold mb-1">${t.title}</h4>
            <p class="text-sm leading-relaxed ${muted}">${t.text}</p>
          </div>`).join('')}
      </div>
      ${c.oneLiner ? `<blockquote class="mt-8 border-l-4 border-ink-900 dark:border-white pl-5 font-serif italic text-xl">${c.oneLiner}</blockquote>` : ''}`,

    framework: c => `
      ${c.intro ? `<div class="prose-body text-[17px] ${muted} mb-8"><p>${c.intro}</p></div>` : ''}
      <div class="space-y-8">

            </ul>
          </div>`).join('')}

    casestudy: c => `
      <p class="font-serif text-lg italic ${muted} mb-6">${c.company ? `<span class="not-italic font-semibold text-ink-900 dark:text-white">${c.company}</span> — ` : ''}${c.tagline}</p>

      <ol class="relative border-l-2 border-ink-200 dark:border-white/10 ml-3 space-y-6 mb-10">
        ${c.execution.map((e, i) => `

      <div class="grid md:grid-cols-2 gap-5">
        <div class="${card} p-6">
          <h3 class="font-semibold mb-3 flex items-center gap-2"><i class="fa-solid fa-gauge-high text-emerald-600 dark:text-emerald-400"></i>Success Drivers</h3>
          <ul class="space-y-2.5 text-sm">
            ${c.drivers.map(d => `<li class="flex gap-2.5"><i class="fa-solid fa-check text-emerald-600 dark:text-emerald-400 mt-1"></i><span class="${muted} leading-relaxed">${d}</span></li>`).join('')}

        <div class="${card} p-6">

        </div>

    slides: c => `
      <p class="leading-relaxed ${muted} mb-8 text-[17px]">${c.intro}</p>
      <div class="grid md:grid-cols-3 gap-5">
        ${c.slides.map((s, i) => `
          <div class="${card} overflow-hidden flex flex-col group hover:-translate-y-1 hover:shadow-xl hover:shadow-black/5 transition">
            <div class="aspect-video bg-ink-900 dark:bg-black/40 text-white p-4 flex flex-col justify-between relative">
              <div class="flex items-center justify-between text-[10px] font-mono text-white/50"><span>SLIDE ${s.n || i + 1}/${c.slides.length}</span><i class="fa-solid ${s.icon} text-accent-dark text-base"></i></div>
              <p class="font-serif text-sm leading-snug">${s.headline}</p>
              <div class="flex gap-1"><span class="h-1 flex-1 rounded bg-white/20"></span><span class="h-1 flex-1 rounded bg-white/20"></span><span class="h-1 w-6 rounded bg-accent-dark"></span></div>
            </div>
            <div class="p-5 flex-1 flex flex-col">
              <h4 class="font-semibold mb-3">${s.title}</h4>
              <ul class="space-y-2 text-sm flex-1">
                ${s.content.map(c => `<li class="flex gap-2"><span class="w-1.5 h-1.5 rounded-full bg-accent dark:bg-accent-dark mt-2 shrink-0"></span><span class="${muted}">${c}</span></li>`).join('')}
              </ul>
              <div class="mt-4 pt-3 border-t border-ink-200 dark:border-white/10 text-xs ${muted}"><i class="fa-regular fa-image mr-1"></i><strong>Visual:</strong> ${s.visual}</div>
            </div>
          </div>`).join('')}
      </div>
      ${c.tips.length ? `<div class="mt-6 rounded-2xl bg-ink-100/70 dark:bg-white/5 p-5">
        <p class="font-semibold text-sm mb-2"><i class="fa-solid fa-trophy text-amber-500 mr-1.5"></i>Judge-winning tips</p>
        <ul class="space-y-1.5 text-sm ${muted}">${c.tips.map(t => `<li>— ${t}</li>`).join('')}</ul>
      </div>` : ''}`,

    venture: (c, b) => `
      <div class="rounded-3xl border-2 border-ink-900 dark:border-white/20 overflow-hidden">
        <div class="p-6 sm:p-8 bg-white dark:bg-white/[.03]">
          <div class="flex flex-wrap items-center gap-3 mb-2">
            <span class="w-10 h-10 rounded-xl bg-gradient-to-br ${b.color} grid place-items-center text-white"><i class="fa-solid fa-rocket"></i></span>
            <h3 class="font-serif text-2xl sm:text-3xl font-bold">${c.name}</h3>
            <span class="text-[10px] uppercase tracking-wider font-semibold px-2 py-1 rounded bg-ink-100 dark:bg-white/10">Concept</span>
          </div>
          <p class="${muted} text-lg">${c.tagline}</p>
          <div class="grid md:grid-cols-2 gap-5 mt-6 text-sm">
            <div><p class="font-semibold mb-1"><i class="fa-solid fa-triangle-exclamation text-rose-500 mr-1.5"></i>Problem</p><p class="${muted} leading-relaxed">${c.problem}</p></div>
            <div><p class="font-semibold mb-1"><i class="fa-solid fa-wand-magic-sparkles text-emerald-500 mr-1.5"></i>Solution</p><p class="${muted} leading-relaxed">${c.solution}</p></div>
          </div>
        </div>

        <div class="p-6 sm:p-8 border-t border-ink-200 dark:border-white/10">
          <h4 class="text-[11px] font-semibold uppercase tracking-[.14em] ${muted} mb-4">Market Sizing</h4>
          <div class="flex flex-col sm:flex-row items-center gap-6">
            <div class="relative w-48 h-48 shrink-0">
              <div class="absolute inset-0 rounded-full bg-ink-200 dark:bg-white/10 grid place-items-start justify-center pt-3 text-[10px] font-bold">TAM</div>
              <div class="absolute inset-[22%] rounded-full bg-ink-700/30 dark:bg-white/20 grid place-items-start justify-center pt-2 text-[10px] font-bold">SAM</div>
              <div class="absolute inset-[40%] rounded-full bg-accent dark:bg-accent-dark grid place-items-center text-[10px] font-bold text-white">SOM</div>
            </div>
            <div class="grid gap-3 flex-1 w-full">
              ${c.market.map(m => `
                <div class="flex items-center gap-4 ${card} px-4 py-3">
                  <span class="w-12 text-xs font-bold text-accent dark:text-accent-dark">${m.tier}</span>
                  <span class="font-serif text-xl font-bold w-20">${m.value}</span>
                  <span class="text-sm ${muted}">${m.desc}</span>
                </div>`).join('')}
            </div>
          </div>
        </div>

        <div class="p-6 sm:p-8 border-t border-ink-200 dark:border-white/10 bg-ink-50 dark:bg-transparent">
          <h4 class="text-[11px] font-semibold uppercase tracking-[.14em] ${muted} mb-4">Unit Economics</h4>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            ${c.unitEconomics.map((u, i) => `
              <div class="${card} p-4 ${i === c.unitEconomics.length - 1 ? 'ring-2 ring-accent dark:ring-accent-dark' : ''}">
                <div class="text-xs ${muted}">${u.label}</div>
                <div class="font-serif text-xl font-bold mt-1">${u.value}</div>
              </div>`).join('')}
          </div>
        </div>

        <div class="p-6 sm:p-8 border-t border-ink-200 dark:border-white/10 bg-ink-900 text-white">
          <div class="flex flex-wrap items-end justify-between gap-4 mb-5">
            <div>
              <h4 class="text-[11px] font-semibold uppercase tracking-[.14em] text-white/50 mb-1">Funding Requirement</h4>
              <p class="font-serif text-3xl font-bold">${c.funding.ask}</p>
            </div>
            <span class="text-sm text-white/60"><i class="fa-regular fa-hourglass-half mr-1"></i>${c.funding.runway} runway</span>
          </div>
          <div class="flex h-3 rounded-full overflow-hidden mb-4">
            ${c.funding.uses.map((u, i) => `<div style="width:${u.pct}%" class="${['bg-orange-400', 'bg-amber-300', 'bg-sky-400', 'bg-white/40'][i % 4]}"></div>`).join('')}
          </div>
          <div class="grid sm:grid-cols-2 gap-x-6 gap-y-2 text-sm mb-6">
            ${c.funding.uses.map((u, i) => `<div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-sm ${['bg-orange-400', 'bg-amber-300', 'bg-sky-400', 'bg-white/40'][i % 4]}"></span><span class="text-white/80 flex-1">${u.label}</span><span class="font-mono">${u.pct}%</span></div>`).join('')}
          </div>
          <p class="text-xs uppercase tracking-wider text-white/50 mb-2">Milestones this round unlocks</p>
          <div class="flex flex-wrap gap-2">
            ${c.funding.milestones.map(m => `<span class="text-xs px-3 py-1.5 rounded-full border border-white/20"><i class="fa-solid fa-flag-checkered mr-1.5 text-orange-300"></i>${m}</span>`).join('')}
          </div>
        </div>
      </div>`,

    text: c => `<div class="post-body">${c.markdown}</div>`,

    blocks: c => `<div class="space-y-10">${c.blocks.map(k => (BLOCK_RENDERERS[k.type] || (() => ''))(k)).join('')}</div>`,
  };

  // Column classes written out in full so the stylesheet always includes them.
  const SM_COLS = { 1: 'sm:grid-cols-1', 2: 'sm:grid-cols-2', 3: 'sm:grid-cols-3', 4: 'sm:grid-cols-4' };
  const IMAGE_WIDTH = { small: 'max-w-sm', medium: 'max-w-xl', wide: 'max-w-none' };

  const BLOCK_RENDERERS = {
    text: k => `<div class="post-body">${k.markdown}</div>`,

    image: k => !k.image ? '' : `
      <figure class="${IMAGE_WIDTH[k.size] || IMAGE_WIDTH.medium} mx-auto">
        <img src="${k.image.replace(/^\/(?=images\/)/, '')}" alt="${k.alt}" loading="lazy" class="w-auto max-w-full max-h-[80vh] mx-auto rounded-2xl border border-ink-200 dark:border-white/10">
        ${k.caption ? `<figcaption class="mt-3 text-sm text-center ${muted}">${k.caption}</figcaption>` : ''}
      </figure>`,

    callout: k => `
      <div class="rounded-2xl border border-orange-200 dark:border-orange-400/20 bg-accent-soft dark:bg-orange-400/[.06] p-6 sm:p-8">
        ${k.heading ? `<div class="flex items-center gap-2 text-accent dark:text-accent-dark font-semibold text-sm mb-3"><i class="fa-solid ${k.icon || 'fa-comment-dots'}"></i> ${k.heading}</div>` : ''}
        <p class="font-serif text-lg sm:text-xl leading-relaxed">${k.text}</p>
      </div>`,

    cards: k => `
      <div class="grid ${SM_COLS[Math.min(3, k.items.length)] || SM_COLS[3]} gap-4">
        ${k.items.map(t => `
          <div class="${card} p-5">
            ${t.icon ? `<div class="w-9 h-9 rounded-lg bg-ink-100 dark:bg-white/10 grid place-items-center mb-3"><i class="fa-solid ${t.icon} text-accent dark:text-accent-dark"></i></div>` : ''}
            <h4 class="font-semibold mb-1">${t.title ?? ''}</h4>
            <p class="text-sm leading-relaxed ${muted}">${t.text ?? ''}</p>
          </div>`).join('')}
      </div>`,

    quote: k => `
      <blockquote class="border-l-4 border-ink-900 dark:border-white pl-5 font-serif italic text-xl">
        ${k.text}${k.author ? `<span class="block mt-2 not-italic font-sans text-sm ${muted}">— ${k.author}</span>` : ''}
      </blockquote>`,

    table: k => `<div class="[&>h3]:mt-0">${renderTable(k.title, k)}</div>`,

    metrics: k => `
      <div class="grid grid-cols-2 ${SM_COLS[Math.min(4, k.items.length)] || SM_COLS[4]} gap-3">
        ${k.items.map(m => `
          <div class="${card} p-4 text-center">
            <div class="font-serif text-2xl sm:text-3xl font-bold">${m.value ?? ''}</div>
            <div class="text-xs mt-1 ${muted}">${m.label ?? ''}</div>
          </div>`).join('')}
      </div>`,

    timeline: k => `
      <div>
        ${k.title ? `<h3 class="font-semibold text-lg mb-4">${k.title}</h3>` : ''}
        <ol class="relative border-l-2 border-ink-200 dark:border-white/10 ml-3 space-y-6">
          ${k.steps.map((e, i) => `
            <li class="pl-6 relative">
              <span class="absolute -left-[13px] top-0 w-6 h-6 rounded-full bg-white dark:bg-ink-900 border-2 border-accent dark:border-accent-dark text-[10px] font-bold grid place-items-center">${i + 1}</span>
              <p class="font-semibold">${e.phase ?? ''}</p>
              <p class="text-sm leading-relaxed ${muted} mt-1">${e.text ?? ''}</p>
            </li>`).join('')}
        </ol>
      </div>`,

    listbox: k => `
      <div class="${card} p-6">
        ${k.title ? `<h3 class="font-semibold mb-3">${k.title}</h3>` : ''}
        <ul class="space-y-2.5 text-sm">
          ${k.items.map(d => `<li class="flex gap-2.5"><i class="fa-solid ${k.icon || 'fa-check'} text-emerald-600 dark:text-emerald-400 mt-1"></i><span class="${muted} leading-relaxed">${d}</span></li>`).join('')}
        </ul>
      </div>`,
  };

  function renderBooklet(b) {
    const chapters = b.chapters.map((c, i) => `
      <section id="ch${i + 1}" class="chapter mb-20" data-chapter="ch${i + 1}">
        ${chapterHeader(i + 1, c.title, c.kicker)}
        ${(CHAPTER_RENDERERS[c.type] || CHAPTER_RENDERERS.text)(c, b)}
      </section>`).join('');
    return `
      <!-- HEADER -->
      <header class="mb-14">
        <div class="relative overflow-hidden rounded-3xl bg-ink-900 text-white p-7 sm:p-10">
          <div class="absolute -right-16 -top-16 w-64 h-64 rounded-full bg-gradient-to-br ${b.color} opacity-30 blur-2xl"></div>
          <div class="absolute right-8 bottom-6 text-7xl sm:text-8xl opacity-10"><i class="fa-solid ${b.icon}"></i></div>
          <p class="relative text-xs font-mono tracking-widest text-white/50 mb-4">${b.volume} · STRATEGY BOOKLET</p>
          <h1 class="relative font-serif text-3xl sm:text-5xl font-semibold leading-[1.1] tracking-tight max-w-3xl">${b.title}</h1>
          <p class="relative mt-4 text-white/70 text-base sm:text-lg max-w-2xl leading-relaxed">${b.subtitle}</p>
          <div class="relative mt-7 flex flex-wrap gap-2.5 text-xs font-medium">
            <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white/10 border border-white/15"><i class="fa-solid fa-industry"></i>${b.industry}</span>
            <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white/10 border border-white/15"><i class="fa-solid fa-user-graduate"></i>${b.audience}</span>
            <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-accent-dark/20 text-orange-200 border border-orange-300/30"><i class="fa-regular fa-clock"></i>${b.readTime} min read</span>
          </div>
        </div>
      </header>

      ${chapters}

      <!-- Next booklet -->
      ${(() => {
        const idx = BOOKLETS.findIndex(x => x.id === b.id);
        const next = BOOKLETS[(idx + 1) % BOOKLETS.length];
        if (next.id === b.id) return '';
        return `<button data-open="${next.id}" class="mt-10 w-full text-left ${card} p-6 hover:border-ink-900 dark:hover:border-white/40 transition flex items-center justify-between gap-4">
          <div><p class="text-xs ${muted}">Next booklet · ${next.volume}</p><p class="font-serif text-xl font-semibold mt-1">${next.title}</p></div>
          <i class="fa-solid fa-arrow-right text-xl"></i></button>`;
      })()}
    `;
  }

  /* =========================================================
     HOME / LIBRARY VIEW
     ========================================================= */
  let view = 'home';
  let activeTopic = 'All';
  let query = '';

  function allTopics() {
    const counts = {};
    [...BOOKLETS, ...POSTS].forEach(b => b.topics.forEach(t => { counts[t] = (counts[t] || 0) + 1; }));
    return Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  }

  function matches(item, fields) {
    const q = query.trim().toLowerCase();
    const topicOk = activeTopic === 'All' || item.topics.includes(activeTopic);
    const hay = [...fields, ...item.topics].join(' ').replace(/<[^>]+>/g, '').toLowerCase();
    return topicOk && (!q || hay.includes(q));
  }
  const filteredBooklets = () => BOOKLETS.filter(b => matches(b, [b.title, b.subtitle, b.industry, b.audience]));
  const filteredPosts = () => POSTS.filter(p => matches(p, [p.title, p.summary, p.body || '']));

  function renderHomeShell() {
    const totalMin = BOOKLETS.reduce((n, b) => n + b.readTime, 0);
    $('#home').innerHTML = `
      <div class="mb-10">
        ${SITE.homeEyebrow ? `<p class="text-[11px] font-semibold uppercase tracking-[.14em] text-accent dark:text-accent-dark mb-3">${SITE.homeEyebrow}</p>` : ''}
        <h1 class="font-serif text-4xl sm:text-5xl font-semibold tracking-tight leading-[1.1]">${SITE.siteName}</h1>
        ${SITE.homeIntro ? `<p class="mt-4 text-lg max-w-2xl ${muted} leading-relaxed">${SITE.homeIntro}</p>` : ''}
        <div class="mt-6 flex flex-wrap gap-6 text-sm">
          <div><span class="font-serif text-2xl font-bold">${BOOKLETS.length}</span> <span class="${muted}">booklets</span></div>
          <div><span class="font-serif text-2xl font-bold">${POSTS.length}</span> <span class="${muted}">${POSTS.length === 1 ? 'post' : 'posts'}</span></div>
          <div><span class="font-serif text-2xl font-bold">${BOOKLETS.reduce((n, b) => n + b.chapters.length, 0)}</span> <span class="${muted}">chapters</span></div>
          <div><span class="font-serif text-2xl font-bold">${totalMin}</span> <span class="${muted}">minutes of reading</span></div>
        </div>
      </div>

      <div class="flex flex-col gap-4 mb-8">
        <div class="relative max-w-md">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-xs ${muted}"></i>
          <label for="librarySearch" class="sr-only">Search booklets and posts</label>
          <input id="librarySearch" type="search" placeholder="Search booklets, posts and topics…" value="${query.replace(/"/g, '&quot;')}"
            class="w-full h-10 pl-9 pr-3 rounded-xl text-sm border border-ink-200 dark:border-white/15 bg-white dark:bg-white/5 focus:outline-none focus:ring-2 focus:ring-accent dark:focus:ring-accent-dark" />
        </div>
        <div>
          <p class="text-[11px] font-semibold uppercase tracking-[.14em] ${muted} mb-2">Filter by topic</p>
          <div id="topicChips" class="flex flex-wrap gap-2"></div>
        </div>
      </div>

      <p id="resultCount" class="text-sm ${muted} mb-6"></p>
      <div id="homeResults" class="space-y-12"></div>`;
    $('#librarySearch').addEventListener('input', e => { query = e.target.value; renderHomeResults(); });
    renderHomeResults();
  }

  function renderHomeResults() {
    const chipCls = 'topic-chip inline-flex items-center gap-1.5 h-8 px-3.5 rounded-full text-xs font-medium border border-ink-200 dark:border-white/15 hover:border-ink-900 dark:hover:border-white/50 transition';
    $('#topicChips').innerHTML = [['All', BOOKLETS.length + POSTS.length], ...allTopics()].map(([t, n]) => `
      <button data-topic="${t}" class="${chipCls} ${t === activeTopic ? 'active' : ''}" aria-pressed="${t === activeTopic}">
        ${t}<span class="opacity-50 font-mono">${n}</span>
      </button>`).join('');

    const list = filteredBooklets();
    const posts = filteredPosts();
    const total = BOOKLETS.length + POSTS.length;
    $('#resultCount').textContent = `Showing ${list.length + posts.length} of ${total} items` + (activeTopic !== 'All' ? ` in “${activeTopic.replace(/&amp;/g, '&')}”` : '') + (query.trim() ? ` matching “${query.trim()}”` : '');

    const sectionHead = (icon, label, n) => `<h2 class="flex items-center gap-2 text-[11px] font-semibold uppercase tracking-[.14em] ${muted} mb-4"><i class="fa-solid ${icon} text-accent dark:text-accent-dark"></i>${label}<span class="font-mono opacity-60">${n}</span></h2>`;
    const topicTags = topics => topics.map(t => `<button data-topic="${t}" class="text-[11px] px-2 py-0.5 rounded-md bg-ink-100 dark:bg-white/10 hover:bg-ink-200 dark:hover:bg-white/20">#${t}</button>`).join('');

    const bookletHtml = list.map(b => `
      <div class="${card} overflow-hidden flex flex-col hover:shadow-xl hover:shadow-black/5 hover:-translate-y-0.5 transition">
        <button data-open="${b.id}" class="text-left relative bg-ink-900 text-white p-6 overflow-hidden">
          <div class="absolute -right-10 -top-10 w-40 h-40 rounded-full bg-gradient-to-br ${b.color} opacity-40 blur-2xl"></div>
          <div class="absolute right-5 bottom-4 text-5xl opacity-10"><i class="fa-solid ${b.icon}"></i></div>
          <p class="relative text-[10px] font-mono tracking-widest text-white/50">${b.volume} · ${b.industry.toUpperCase()}</p>
          <h3 class="relative font-serif text-2xl font-semibold leading-tight mt-2 pr-10">${b.title}</h3>
        </button>
        <div class="p-6 flex-1 flex flex-col gap-4">
          <p class="text-sm leading-relaxed ${muted}">${b.subtitle}</p>
          <div class="flex flex-wrap gap-1.5">${topicTags(b.topics)}</div>
          <div>
            <p class="text-[11px] font-semibold uppercase tracking-[.14em] ${muted} mb-2">Jump to chapter</p>
            <div class="flex flex-wrap gap-1.5">
              ${chaptersOf(b).map(c => `<a href="#${b.id}" data-open="${b.id}" data-chapter-target="${c.id}" title="${c.label}" class="inline-flex items-center gap-1 text-xs px-2.5 py-1 rounded-full border border-ink-200 dark:border-white/15 hover:border-accent hover:text-accent dark:hover:border-accent-dark dark:hover:text-accent-dark"><i class="fa-solid ${c.icon} text-[10px]"></i>Ch ${c.num}</a>`).join('')}
            </div>
          </div>
          <div class="mt-auto pt-4 border-t border-ink-200 dark:border-white/10 flex items-center justify-between text-xs ${muted}">
            <span><i class="fa-regular fa-clock mr-1"></i>${b.readTime} min · ${b.audience}</span>
            <button data-open="${b.id}" class="font-semibold text-ink-900 dark:text-white hover:text-accent dark:hover:text-accent-dark">Read booklet <i class="fa-solid fa-arrow-right ml-1"></i></button>
          </div>
        </div>
      </div>`).join('');

    const postHtml = posts.map(p => `
      <div class="${card} p-6 flex flex-col sm:flex-row gap-4 sm:items-start hover:shadow-xl hover:shadow-black/5 transition">
        <div class="sm:w-32 shrink-0 text-xs ${muted} font-mono pt-1">${formatDate(p.date)}</div>
        <div class="min-w-0 flex-1">
          <a href="#post-${p.slug}" data-post="${p.slug}" class="font-serif text-xl font-semibold leading-snug hover:text-accent dark:hover:text-accent-dark">${p.title}</a>
          <p class="text-sm leading-relaxed ${muted} mt-1.5">${p.summary}</p>
          <div class="flex flex-wrap items-center gap-1.5 mt-3">${topicTags(p.topics)}<span class="text-xs ${muted} ml-1"><i class="fa-regular fa-clock mr-1"></i>${p.readTime} min read</span></div>
        </div>
      </div>`).join('');

    $('#homeResults').innerHTML = (list.length + posts.length) ? `
      ${list.length ? `<section>${sectionHead('fa-book', SITE.bookletsHeading, list.length)}<div class="grid md:grid-cols-2 gap-6">${bookletHtml}</div></section>` : ''}
      ${posts.length ? `<section>${sectionHead('fa-pen-nib', SITE.postsHeading, posts.length)}<div class="space-y-4">${postHtml}</div></section>` : ''}` : `
      <div class="${card} p-10 text-center">
        <i class="fa-regular fa-folder-open text-3xl ${muted}"></i>
        <p class="font-semibold mt-3">Nothing matches these filters</p>
        <p class="text-sm ${muted} mt-1">Try another topic or clear the search.</p>
        <button data-reset-filters class="mt-4 text-sm font-medium text-accent dark:text-accent-dark">Clear filters</button>
      </div>`;
  }

  /* =========================================================
     SIDEBAR, CONTENT BAR & ROUTING
     ========================================================= */
  function renderSidebar() {
    $('#homeCount').textContent = BOOKLETS.length + POSTS.length;
    $('#postSection').classList.toggle('hidden', !POSTS.length);
    $('#postList').innerHTML = POSTS.slice(0, 8).map(p => {
      const active = view === 'post' && p.slug === currentPost;
      return `<li><a href="#post-${p.slug}" data-post="${p.slug}" class="block px-2.5 py-2 rounded-lg text-sm leading-snug transition ${active ? 'font-semibold bg-white dark:bg-white/5' : 'text-ink-700/80 dark:text-white/70 hover:bg-ink-100 dark:hover:bg-white/5'}">${p.title}<span class="block text-[11px] font-mono mt-0.5 opacity-60">${formatDate(p.date)}</span></a></li>`;
    }).join('');
    $('.home-link').classList.toggle('bg-white', view === 'home');
    $('.home-link').classList.toggle('dark:bg-white/5', view === 'home');
    $('#chapterSection').classList.toggle('hidden', view !== 'booklet');
    $('#tipSection').classList.toggle('hidden', view !== 'booklet');

    $('#bookletList').innerHTML = BOOKLETS.map(b => {
      const active = view === 'booklet' && b.id === currentId;
      return `
        <li>
          <button data-open="${b.id}" class="w-full text-left flex gap-3 p-2.5 rounded-xl transition border ${active
            ? 'bg-white dark:bg-white/5 border-ink-200 dark:border-white/10 shadow-sm'
            : 'border-transparent hover:bg-ink-100 dark:hover:bg-white/5'}" aria-current="${active}">
            <span class="shrink-0 w-10 h-12 rounded-md bg-gradient-to-br ${b.color} grid place-items-center text-white text-sm shadow ${active ? '' : 'opacity-70'}"><i class="fa-solid ${b.icon}"></i></span>
            <span class="min-w-0">
              <span class="block text-[10px] font-mono ${active ? 'text-accent dark:text-accent-dark' : 'text-ink-700/50 dark:text-white/40'}">${b.volume}</span>
              <span class="block text-sm leading-snug ${active ? 'font-semibold' : 'text-ink-700/80 dark:text-white/70'}">${b.title}</span>
            </span>
          </button>
        </li>`;
    }).join('');

    const current = view === 'booklet' ? BOOKLETS.find(x => x.id === currentId) : null;
    $('#tipMax').textContent = Math.min(9, chaptersOf(current).length);
    $('#chapterNav').innerHTML = chaptersOf(current).map(c => `
      <a href="#${c.id}" data-target="${c.id}" class="nav-link flex items-center gap-3 px-2.5 py-2 rounded-lg text-sm text-ink-700/80 dark:text-white/60 hover:text-ink-900 dark:hover:text-white transition">
        <span class="nav-dot w-1.5 h-1.5 rounded-full bg-ink-200 dark:bg-white/20 transition"></span>
        <span class="text-[11px] font-mono w-8 shrink-0 opacity-60">Ch ${c.num}</span>
        <span class="leading-snug">${c.label}</span>
      </a>`).join('');
  }

  function renderContentBar() {
    $('#barLinks').innerHTML = chaptersOf(BOOKLETS.find(x => x.id === currentId)).map(c => `
      <a href="#${c.id}" data-target="${c.id}" class="bar-link shrink-0 inline-flex items-center gap-1.5 h-8 px-3 rounded-full text-xs font-medium border border-transparent text-ink-700/80 dark:text-white/70 hover:border-ink-200 dark:hover:border-white/15 transition whitespace-nowrap">
        <span class="font-mono opacity-60">${c.num}</span>${c.label}
      </a>`).join('');
    $('#bookletJump').innerHTML = BOOKLETS.map(b => `<option value="${b.id}" ${b.id === currentId ? 'selected' : ''}>${b.volume} · ${b.title}</option>`).join('');
  }

  function markActiveChapter(id) {
    $$('.nav-link, .bar-link').forEach(l => l.classList.toggle('active', l.dataset.target === id));
    const pill = $(`.bar-link[data-target="${id}"]`);
    const bar = $('#barLinks');
    if (pill && bar) bar.scrollTo({ left: pill.offsetLeft - bar.offsetLeft - 16, behavior: 'smooth' });
  }

  function setupScrollSpy() {
    if (observer) observer.disconnect();
    observer = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) markActiveChapter(e.target.id); });
    }, { rootMargin: '-30% 0px -60% 0px' });
    $$('.chapter').forEach(s => observer.observe(s));
  }

  let currentPost = null;
  function showOnly(id) {
    ['#home', '#bookletView', '#postView'].forEach(sel => $(sel).classList.toggle('hidden', sel !== id));
  }

  function showHome() {
    view = 'home';
    if (observer) observer.disconnect();
    showOnly('#home');
    renderHomeShell();
    renderSidebar();
    document.title = SITE.plainName;
    window.scrollTo({ top: 0 });
  }

  function showBooklet(id, chapter) {
    const b = BOOKLETS.find(x => x.id === id);
    if (!b) return showHome();
    const switching = view === 'booklet' && currentId !== id;
    view = 'booklet';
    currentId = id;
    showOnly('#bookletView');
    const el = $('#booklet');
    const paint = () => {
      el.innerHTML = renderBooklet(b);
      renderSidebar();
      renderContentBar();
      setupScrollSpy();
      document.title = `${b.title.replace(/&amp;/g, '&')} · ${SITE.plainName}`;
      if (chapter) setTimeout(() => scrollToChapter(chapter), 60);
      else window.scrollTo({ top: 0, behavior: switching ? 'smooth' : 'auto' });
      requestAnimationFrame(() => el.classList.remove('is-switching'));
    };
    if (switching) { el.classList.add('is-switching'); setTimeout(paint, 200); } else paint();
  }

  function showPost(slug) {
    const p = POSTS.find(x => x.slug === slug);
    if (!p) return showHome();
    view = 'post';
    currentPost = slug;
    if (observer) observer.disconnect();
    showOnly('#postView');
    $('#postView').innerHTML = `
      <button data-home class="inline-flex items-center gap-1.5 h-8 px-3 rounded-full text-xs font-medium border border-ink-200 dark:border-white/15 hover:bg-white dark:hover:bg-white/5 mb-8"><i class="fa-solid fa-arrow-left text-[10px]"></i>Library</button>
      <p class="text-[11px] font-semibold uppercase tracking-[.14em] text-accent dark:text-accent-dark">Blog Post · ${formatDate(p.date)}</p>
      <h1 class="font-serif text-3xl sm:text-5xl font-semibold tracking-tight leading-[1.1] mt-3">${p.title}</h1>
      ${p.summary ? `<p class="mt-4 text-lg ${muted} leading-relaxed">${p.summary}</p>` : ''}
      <div class="flex flex-wrap items-center gap-2 mt-6 pb-8 border-b border-ink-200 dark:border-white/10 text-xs">
        <span class="${muted}"><i class="fa-regular fa-clock mr-1"></i>${p.readTime} min read</span>
        ${p.topics.map(t => `<span class="px-2 py-0.5 rounded-md bg-ink-100 dark:bg-white/10">#${t}</span>`).join('')}
      </div>
      <div class="post-body mt-8">${p.html}</div>`;
    renderSidebar();
    document.title = `${p.title.replace(/&amp;/g, '&')} · ${SITE.plainName}`;
    window.scrollTo({ top: 0 });
  }

  function route(hash, chapter) {
    if (hash.startsWith('post-')) showPost(hash.slice(5));
    else if (BOOKLETS.some(b => b.id === hash)) showBooklet(hash, chapter);
    else showHome();
  }

  function navigate(hash, chapter) {
    try { if (location.hash.slice(1) !== hash) history.pushState(null, '', '#' + hash); } catch (_) {}
    route(hash, chapter);
  }
  window.addEventListener('popstate', () => route(location.hash.slice(1)));

  function openBooklet(id, chapter) { navigate(id, chapter); }

  function scrollToChapter(chId) {
    const target = document.getElementById(chId);
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* =========================================================
     UI WIRING
     ========================================================= */
  function closeMenu() {
    $('#sidebar').classList.add('-translate-x-full');
    $('#overlay').classList.add('hidden');
  }
  $('#menuBtn').addEventListener('click', () => {
    $('#sidebar').classList.remove('-translate-x-full');
    $('#overlay').classList.remove('hidden');
  });
  $('#overlay').addEventListener('click', closeMenu);

  document.addEventListener('click', e => {
    const home = e.target.closest('[data-home]');
    if (home) { e.preventDefault(); closeMenu(); navigate('home'); return; }
    const post = e.target.closest('[data-post]');
    if (post) { e.preventDefault(); closeMenu(); navigate('post-' + post.dataset.post); return; }
    const topic = e.target.closest('[data-topic]');
    if (topic) {
      e.preventDefault(); activeTopic = esc(topic.dataset.topic); // topics are stored escaped
      if (view === 'home') renderHomeResults(); else navigate('home');
      return;
    }
    if (e.target.closest('[data-reset-filters]')) { activeTopic = 'All'; query = ''; renderHomeShell(); return; }
    const open = e.target.closest('[data-open]');
    if (open) {
      e.preventDefault(); closeMenu();
      const chapter = open.dataset.chapterTarget;
      if (view === 'booklet' && open.dataset.open === currentId) { if (chapter) scrollToChapter(chapter); return; }
      openBooklet(open.dataset.open, chapter);
      return;
    }
    const nav = e.target.closest('.nav-link, .bar-link');
    if (nav) { e.preventDefault(); closeMenu(); scrollToChapter(nav.dataset.target); }
  });
  $('#bookletJump').addEventListener('change', e => openBooklet(e.target.value));
  $('#brand').addEventListener('click', e => { e.preventDefault(); navigate('home'); });

  document.addEventListener('keydown', e => {
    if (view !== 'booklet' || e.target.matches('input, textarea, select') || e.metaKey || e.ctrlKey || e.altKey) return;
    const n = parseInt(e.key, 10);
    const chapters = chaptersOf(BOOKLETS.find(x => x.id === currentId));
    if (n >= 1 && n <= chapters.length) scrollToChapter(chapters[n - 1].id);
  });

  // Reading progress
  window.addEventListener('scroll', () => {
    const h = document.documentElement;
    const pct = (h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight)) * 100;
    $('#progress').style.width = pct + '%';
    // A short last chapter can never reach the scroll-spy line, so mark it at the bottom of the page.
    const chapters = $$('.chapter');
    if (view === 'booklet' && chapters.length && pct >= 99.5) markActiveChapter(chapters[chapters.length - 1].id);
  }, { passive: true });

  // Theme: follow the visitor's device setting, including when it changes.
  const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
  const applyTheme = () => document.documentElement.classList.toggle('dark', darkQuery.matches);
  applyTheme();
  darkQuery.addEventListener('change', applyTheme);

  /* =========================================================
     EDITOR PREVIEW
     The editor at /admin loads this page as index.html#preview and sends the entry being
     edited with postMessage, so the preview uses exactly the same design as the live site.
     ========================================================= */
  const PREVIEW = location.hash === '#preview';
  let libraryReady = false;
  let pendingPreview = null;

  function renderPreview(msg) {
    if (!libraryReady) { pendingPreview = msg; return; }
    const scrollY = window.scrollY;
    const data = msg.data || {};
    if (msg.kind === 'posts') {
      const post = preparePost({ topics: [], summary: '', ...data, slug: '__preview' });
      POSTS = [post, ...POSTS.filter(x => x.slug !== '__preview')];
      showPost('__preview');
    } else if (msg.kind === 'booklets') {
      const booklet = renderInlineMarkdown(withDefaults({ ...data, id: '__preview' }));
      BOOKLETS = [booklet, ...BOOKLETS.filter(x => x.id !== '__preview')];
      view = 'booklet';
      currentId = '__preview';
      showOnly('#bookletView');
      $('#booklet').innerHTML = renderBooklet(booklet);
      renderSidebar();
      renderContentBar();
      setupScrollSpy();
    } else if (msg.kind === 'settings') {
      SITE = prepareSite(data);
      applySiteText();
      showHome();
    }
    window.scrollTo(0, scrollY); // keep the reader's place while typing
  }

  if (PREVIEW) {
    window.addEventListener('message', e => {
      if (e.origin === location.origin && e.data?.type === 'msv-preview') renderPreview(e.data);
    });
  }

  // Boot
  $('#year').textContent = new Date().getFullYear();
  $('#home').classList.remove('hidden');
  $('#home').innerHTML = `<p class="text-sm text-ink-700/60 dark:text-white/50"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading the library…</p>`;
  // A unique address on every visit skips GitHub Pages' 10-minute cache, so newly
  // published posts and edits show up as soon as the deploy finishes.
  fetch(`content/library.json?v=${Date.now()}`, { cache: 'no-store' })
    .then(res => { if (!res.ok) throw new Error(res.status + ' ' + res.statusText); return res.json(); })
    .then(data => {
      SITE = prepareSite(data.site);
      applySiteText();
      BOOKLETS = (data.booklets || []).map(b => renderInlineMarkdown(withDefaults(b)));
      POSTS = (data.posts || []).map(preparePost);
      currentId = BOOKLETS[0]?.id ?? null;
      libraryReady = true;
      if (PREVIEW) { if (pendingPreview) renderPreview(pendingPreview); return; }
      route(location.hash.slice(1));
    })
    .catch(err => {
      libraryReady = true;
      if (PREVIEW) { if (pendingPreview) renderPreview(pendingPreview); return; }
      $('#home').innerHTML = `<div class="rounded-2xl border border-rose-300 bg-rose-50 dark:bg-rose-500/10 dark:border-rose-400/30 p-6 text-sm">
        <p class="font-semibold">The library couldn't be loaded.</p>
        <p class="mt-1 opacity-80">content/library.json is missing or unreadable (${esc(err.message)}). On Netlify it is created by the build command in netlify.toml. To preview on your computer, run <code>node scripts/build-content.js</code> and serve the folder, for example with <code>npx serve</code>.</p></div>`;
    });
  </script>
</body>
</html>
